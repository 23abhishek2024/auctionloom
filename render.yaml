# Render Blueprint for the AuctionLoom backend, matching the live setup:
#   - one free web service: Express + Socket.IO + the 15-second in-process closing sweep
#   - the database is Supabase (set DATABASE_URL in the Render dashboard)
#   - the React frontend is deployed on Vercel (vercel.json)
#
# Render's free plan has no background workers, so the job worker and the scheduler run only
# in Docker Compose. On a paid plan they can run here too: see the commented services below.

services:
  # ==========================================
  # AuctionLoom Backend Web Service (API + Sockets)
  # ==========================================
  - type: web
    name: auctionloom-backend
    runtime: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL # Supabase connection string, entered in the dashboard
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://auctionloom.vercel.app
      - key: GEMINI_API_KEY # optional: without it the built-in copy generator is used
        sync: false
      - key: TRUST_PROXY # proxy hops in front of the app; check /health -> clientIp after deploying
        value: 1

  # ==========================================
  # Paid plan only: background job worker and scheduler
