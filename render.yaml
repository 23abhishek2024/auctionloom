databases:
  - name: auctionloom-db
    databaseName: auctionloom
    user: postgres
    plan: free
    region: oregon

services:
  # ==========================================
  # AuctionLoom Backend Web Service (API + Sockets)
  # ==========================================
  - type: web
    name: auctionloom-backend
    env: node
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: auctionloom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://auctionloom-frontend.onrender.com

  # ==========================================
  # AuctionLoom Background Worker (Job Queue)
  # ==========================================
  - type: worker
    name: auctionloom-worker
    env: node
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: auctionloom-db
          property: connectionString

  # ==========================================
  # AuctionLoom Job Scheduler
  # ==========================================
  - type: worker
    name: auctionloom-scheduler
    env: node
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: npm run scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: auctionloom-db
          property: connectionString

  # ==========================================
  # AuctionLoom React SPA Static Site
  # ==========================================
  - type: web
    name: auctionloom-frontend
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://auctionloom-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://auctionloom-backend.onrender.com
