name: AuctionLoom CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # Backend Verification & Automated Tests
  # ==========================================
  test-backend:
    name: Backend Test Suite (Phases 1-8)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: auctionloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Bootstrap Database Schema
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: auctionloom
          DB_USER: postgres
          DB_PASSWORD: password123
          DISABLE_DB_SSL: 'true'
        run: npm run migrate

      - name: Launch Backend Server in Background
        working-directory: ./backend
        env:
          PORT: 5000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: auctionloom
          DB_USER: postgres
          DB_PASSWORD: password123
          JWT_SECRET: ci_jwt_secret_test_key_12345
          DISABLE_DB_SSL: 'true'
        run: |
          node src/app.js &
          for i in {1..30}; do
            if curl -s http://localhost:5000/health > /dev/null; then
              echo "Backend server is up and listening on port 5000"
              break
            fi
            echo "Waiting for backend server..."
            sleep 1
          done

      - name: Run Automated Test Suite
        working-directory: ./backend
        env:
          CI: 'true'
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: auctionloom
          DB_USER: postgres
          DB_PASSWORD: password123
          JWT_SECRET: ci_jwt_secret_test_key_12345
          DISABLE_DB_SSL: 'true'
        run: npm test

  # ==========================================
  # Frontend Build & Typecheck Verification
  # ==========================================
  build-frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Vite Production Assets
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_SOCKET_URL: http://localhost:5000
        run: npm run build
